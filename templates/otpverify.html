<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#ff9966,#ff5e62);
        }

        .otp-box{
            width:350px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.2);
            text-align:center;
        }

        h2{
            margin-bottom:20px;
            color:#333;
        }

        p{
            margin-bottom:20px;
            color:gray;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:#ff5722;
            color:white;
            font-size:18px;
            border-radius:8px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#e64a19;
        }
    </style>
</head>
<body>

    <div class="otp-box">
        {% with messages = get_flashed_messages() %}
{% if messages %}
    {% for message in messages %}
    <b>{{ message }}</b>
    {% endfor %}
{% endif %}
{% endwith %}
        <h2>OTP Verification</h2>

        <p>Enter the OTP sent to your email/phone</p>

        <form method="POST">
            <input type="text" name="userotp" placeholder="Enter OTP" required>
            <button type="submit">Verify OTP</button>
        </form>
    </div>

</body>
</html>
